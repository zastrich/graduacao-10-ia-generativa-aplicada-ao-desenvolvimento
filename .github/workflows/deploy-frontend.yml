name: Deploy Frontend SPA

on:
  workflow_run:
    workflows: ["Deploy Backend Lambdas"]
    types: [completed]
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment: production
    steps:
      - uses: actions/checkout@v4.2.0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'src/frontend/package-lock.json'

      - name: Install Dependencies
        run: |
          cd src/frontend
          npm ci

      - name: Security Audit
        run: |
          cd src/frontend
          npx audit-ci --config audit-ci.jsonc

      - name: Build React SPA
        run: |
          cd src/frontend
          npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || format('https://{0}', vars.API_URL) }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync Static Files to S3 Bucket
        run: |
          BUCKET="${{ vars.FRONTEND_S3_BUCKET }}"
          if [ -z "$BUCKET" ]; then
            echo "::error::Variable FRONTEND_S3_BUCKET nao configurada."
            exit 1
          fi
          aws s3 sync src/frontend/dist/ s3://${BUCKET} \
            --delete \
            --exclude "index.html" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp src/frontend/dist/index.html s3://${BUCKET}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront Cache
        run: |
          CF_ID="${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}"
          if [ -z "$CF_ID" ] || [ "$CF_ID" = "-" ] || [ "$CF_ID" = "none" ]; then
            echo "::warning::CLOUDFRONT_DISTRIBUTION_ID nao configurado — invalidacao ignorada."
            exit 0
          fi
          aws cloudfront create-invalidation \
            --distribution-id "${CF_ID}" \
            --paths "/*"
