name: Deploy Backend Lambdas

on:
  push:
    branches: [ main ]
    paths:
      - 'src/backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:
  # Acionado pela infra após deploy bem-sucedido (o dist compilado é lido pelo sam build da infra)
  workflow_run:
    workflows: ["Deploy Infrastructure"]
    types: [completed]
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Se acionado por workflow_run, só continua se a infra passou
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4.2.0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'src/backend/package-lock.json'

      - name: Install Dependencies
        run: |
          cd src/backend
          npm ci

      - name: Security Audit
        run: |
          cd src/backend
          npx audit-ci --config audit-ci.jsonc

      - name: Run Unit Tests
        run: |
          cd src/backend
          npm test

      - name: Build TypeScript
        run: |
          cd src/backend
          npm run build

  # Nota: o deploy das Lambdas é feito pela pipeline Deploy Infrastructure
  # via sam build (CodeUri: ../backend/dist/) + sam deploy.
  # Este job valida que o código compila corretamente antes de qualquer deploy.
  # Manter separado evita conflito de changeset ao rodar infra e backend em paralelo.
