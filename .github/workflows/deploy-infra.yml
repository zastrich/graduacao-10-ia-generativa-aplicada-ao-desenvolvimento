name: Deploy Infrastructure

on:
  push:
    branches: [ main ]
    paths:
      - 'src/infrastructure/**'
      - '.github/workflows/deploy-infra.yml'
  # Permite disparar manualmente pelo GitHub Actions UI ou gh CLI
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.0

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Validate SAM Template
        run: |
          cd src/infrastructure
          sam validate

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4.2.0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'src/backend/package-lock.json'

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Cleanup stacks in bad state
        run: |
          REGION="${{ vars.AWS_REGION }}"
          for STACK in "aws-sam-cli-managed-default" "copiloto-corporativo-stack"; do
            STATUS=$(aws cloudformation describe-stacks \
              --stack-name "$STACK" \
              --region "$REGION" \
              --query "Stacks[0].StackStatus" \
              --output text 2>/dev/null || echo "DOES_NOT_EXIST")
            echo "$STACK status: $STATUS"
            if [[ "$STATUS" == "REVIEW_IN_PROGRESS" || "$STATUS" == "ROLLBACK_COMPLETE" || "$STATUS" == "ROLLBACK_FAILED" ]]; then
              echo "Deletando stack $STACK ($STATUS)..."
              aws cloudformation delete-stack --stack-name "$STACK" --region "$REGION"
              aws cloudformation wait stack-delete-complete --stack-name "$STACK" --region "$REGION"
              echo "$STACK deletada."
            fi
          done

      - name: Build & Deploy SAM Stack
        run: |
          # Compila o backend antes do sam build (dist é necessário como CodeUri)
          cd src/backend
          npm ci
          npm run build:lambda
          cd ../infrastructure
          sam build
          sam deploy \
            --resolve-s3 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --stack-name copiloto-corporativo-stack \
            --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND \
            --region ${{ vars.AWS_REGION }} \
            --parameter-overrides \
              Stage=${{ vars.DEPLOY_STAGE || 'prod' }} \
              JwtSecret=${{ secrets.JWT_SECRET }} \
              AllowedOrigin="${{ vars.ALLOWED_ORIGIN || '*' }}" \
              HostedZoneId="${{ vars.HOSTED_ZONE_ID || '' }}" \
              WebDomain="${{ vars.WEB_URL || '' }}" \
              ApiDomain="${{ vars.API_URL || '' }}" \
              CertificateArn="${{ secrets.CERTIFICATE_ARN || '' }}"
