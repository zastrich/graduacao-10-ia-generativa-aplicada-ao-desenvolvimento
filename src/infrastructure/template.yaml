AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: |
  Copiloto Corporativo com IA - Infraestrutura Serverless Assistente corporativo inteligente usando AWS Bedrock (Gemma 3 4b-it)

Globals:
  Function:
    Runtime: nodejs24.x
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        KNOWLEDGE_BASES_TABLE: !Ref KnowledgeBasesTable
        CONVERSATIONS_TABLE: !Ref ConversationsTable
        MESSAGES_TABLE: !Ref MessagesTable
        USERS_TABLE: !Ref UsersTable
        KNOWLEDGE_BUCKET: !Ref KnowledgeBucket
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        BEDROCK_REGION: us-east-1
        JWT_SECRET: !Ref JwtSecret
        # Task 7: ALLOWED_ORIGINS usa a URL do CloudFront para restringir CORS
        ALLOWED_ORIGINS: !Sub https://${FrontendDistribution.DomainName}
    Architectures:
      - x86_64

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod

  # Task 1 / Task 8: sem Default — deploy falha explicitamente se não fornecido
  JwtSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: >
      Segredo usado para assinar JWTs. Obrigatório. Gere com:
      node -e "console.log(require('crypto').randomBytes(64).toString('hex'))"

  # Task 8: parâmetro para o modelo Bedrock, usado no ARN da IAM policy
  BedrockModelId:
    Type: String
    Default: google.gemma-3-4b-it
    Description: ID do modelo Bedrock usado para inferência.

Resources:
  # ============================================================
  # API Gateway
  # ============================================================
  CopilotoApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub copiloto-api-${Stage}
      StageName: !Ref Stage
      # Task 7: CORS restrito à origem do CloudFront
      Cors:
        AllowMethods: '''GET,POST,PUT,DELETE,OPTIONS'''
        AllowHeaders: '''Content-Type,Authorization'''
        AllowOrigin: !Sub '''https://${FrontendDistribution.DomainName}'''
        AllowCredentials: true

  # ============================================================
  # DynamoDB Tables
  # ============================================================
  KnowledgeBasesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub copiloto-knowledge-bases-${Stage}
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: slug
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: slug-index
          KeySchema:
            - AttributeName: slug
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  ConversationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub copiloto-conversations-${Stage}
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: userUid
          AttributeType: S
        - AttributeName: knowledgeBaseId
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: userUid-index
          KeySchema:
            - AttributeName: userUid
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: knowledgeBase-index
          KeySchema:
            - AttributeName: knowledgeBaseId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  MessagesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub copiloto-messages-${Stage}
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
      AttributeDefinitions:
        - AttributeName: conversationId
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: conversationId
          KeyType: HASH
        - AttributeName: createdAt
          KeyType: RANGE

  UsersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub copiloto-users-${Stage}
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: email-index
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  # ============================================================
  # S3 Buckets
  # ============================================================

  # Bucket de logs — destino centralizado para access logs
  LogsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub copiloto-logs-${Stage}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
            BucketKeyEnabled: true
      VersioningConfiguration:
        Status: Enabled
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      LoggingConfiguration:
        LogFilePrefix: logs-bucket/

  LogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref LogsBucket
      PolicyDocument:
        Statement:
          - Sid: DenyNonSSLRequests
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt LogsBucket.Arn
              - !Sub ${LogsBucket.Arn}/*
            Condition:
              Bool:
                'aws:SecureTransport': false

  KnowledgeBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub conhecimento-ia-generativa-${Stage}
      # Bucket privado — acesso exclusivo pelas Lambdas via IAM
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
            BucketKeyEnabled: true
      LoggingConfiguration:
        DestinationBucketName: !Ref LogsBucket
        LogFilePrefix: knowledge-bucket/
      # Task 7 / L4: removido CorsConfiguration — bucket é privado, sem acesso direto do browser

  FrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub copiloto-frontend-${Stage}
      # Bucket privado — conteúdo servido exclusivamente via CloudFront (OAC)
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
            BucketKeyEnabled: true
      VersioningConfiguration:
        Status: Enabled
      LoggingConfiguration:
        DestinationBucketName: !Ref LogsBucket
        LogFilePrefix: frontend-bucket/

  # Origin Access Control — permite ao CloudFront assinar requests ao S3
  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub copiloto-frontend-oac-${Stage}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Task 9: Security Headers Policy para o CloudFront
  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub copiloto-security-headers-${Stage}
        Comment: Security headers para o frontend do Copiloto Corporativo
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Preload: true
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          XSSProtection:
            ModeBlock: true
            Protection: true
            Override: true
          ContentSecurityPolicy:
            ContentSecurityPolicy: !Sub >
              default-src 'self';
              script-src 'self' 'unsafe-inline';
              style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
              font-src 'self' https://fonts.gstatic.com;
              img-src 'self' data:;
              connect-src 'self' https://${CopilotoApi}.execute-api.${AWS::Region}.amazonaws.com;
              frame-ancestors 'none';
            Override: true

  # CloudFront Distribution — CDN + HTTPS + SPA fallback + Security Headers
  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub Copiloto Frontend - ${Stage}
        DefaultRootObject: index.html
        Origins:
          - Id: FrontendS3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''
            OriginAccessControlId: !GetAtt FrontendOAC.Id
        DefaultCacheBehavior:
          TargetOriginId: FrontendS3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # CachingOptimized (gerenciada pela AWS)
          # Task 9: associa a policy de security headers
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
        # Redireciona erros 403/404 para index.html (SPA routing)
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
        HttpVersion: http2and3
        PriceClass: PriceClass_100

  # Bucket Policy — nega requests sem SSL ao KnowledgeBucket
  KnowledgeBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref KnowledgeBucket
      PolicyDocument:
        Statement:
          - Sid: DenyNonSSLRequests
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt KnowledgeBucket.Arn
              - !Sub ${KnowledgeBucket.Arn}/*
            Condition:
              Bool:
                'aws:SecureTransport': false

  # Bucket Policy — permite apenas CloudFront (OAC) ler objetos do FrontendBucket
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontServicePrincipal
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${FrontendBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}
          - Sid: DenyNonSSLRequests
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt FrontendBucket.Arn
              - !Sub ${FrontendBucket.Arn}/*
            Condition:
              Bool:
                'aws:SecureTransport': false

  # ============================================================
  # Lambda Functions
  # ============================================================

  # --- Auth ---
  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub copiloto-auth-${Stage}
      CodeUri: ../backend/dist/
      Handler: handlers/auth.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
      Events:
        Status:
          Type: Api
          Properties:
            RestApiId: !Ref CopilotoApi
            Path: /auth/status
            Method: GET
        Login:
          Type: Api
          Properties:
            RestApiId: !Ref CopilotoApi
            Path: /auth/login
            Method: POST
        Register:
          Type: Api
          Properties:
            RestApiId: !Ref CopilotoApi
            Path: /auth/register
            Method: POST

  # --- Knowledge Bases ---
  KnowledgeBasesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub copiloto-knowledge-bases-${Stage}
      CodeUri: ../backend/dist/
      Handler: handlers/knowledgeBases.handler
      Timeout: 60
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref KnowledgeBasesTable
        - S3CrudPolicy:
            BucketName: !Ref KnowledgeBucket
      Events:
        Create:
          Type: Api
          Properties:
            RestApiId: !Ref CopilotoApi
            Path: /admin/knowledge-bases
            Method: POST
        List:
          Type: Api
          Properties:
            RestApiId: !Ref CopilotoApi
            Path: /admin/knowledge-bases
            Method: GET
        GetOne:
          Type: Api
          Properties:
            RestApiId: !Ref CopilotoApi
            Path: /admin/knowledge-bases/{id}
            Method: GET
        Update:
          Type: Api
          Properties:
            RestApiId: !Ref CopilotoApi
            Path: /admin/knowledge-bases/{id}
            Method: PUT
        Delete:
          Type: Api
          Properties:
            RestApiId: !Ref CopilotoApi
            Path: /admin/knowledge-bases/{id}
            Method: DELETE
        Retrain:
          Type: Api
          Properties:
            RestApiId: !Ref CopilotoApi
            Path: /admin/knowledge-bases/{id}/retrain
            Method: POST

  # --- File Upload ---
  FileUploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub copiloto-file-upload-${Stage}
      CodeUri: ../backend/dist/
      Handler: handlers/files.handler
      Timeout: 120
      MemorySize: 512
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref KnowledgeBasesTable
        - S3CrudPolicy:
            BucketName: !Ref KnowledgeBucket
      Events:
        Upload:
          Type: Api
          Properties:
            RestApiId: !Ref CopilotoApi
            Path: /admin/knowledge-bases/{id}/files
            Method: POST
        DeleteFile:
          Type: Api
          Properties:
            RestApiId: !Ref CopilotoApi
            Path: /admin/knowledge-bases/{id}/files/{fileId}
            Method: DELETE
        AddLink:
          Type: Api
          Properties:
            RestApiId: !Ref CopilotoApi
            Path: /admin/knowledge-bases/{id}/links
            Method: POST

  # --- Chat / Inference ---
  ChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub copiloto-chat-${Stage}
      CodeUri: ../backend/dist/
      Handler: handlers/chat.handler
      Timeout: 120
      MemorySize: 512
      Policies:
        # Task 8: KnowledgeBases é só leitura para o chat
        - DynamoDBReadPolicy:
            TableName: !Ref KnowledgeBasesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConversationsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MessagesTable
        - S3ReadPolicy:
            BucketName: !Ref KnowledgeBucket
        # Task 8: Bedrock restrito ao ARN do modelo específico
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource:
                - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}
      Events:
        SendMessage:
          Type: Api
          Properties:
            RestApiId: !Ref CopilotoApi
            Path: /chat/{slug}
            Method: POST

  # --- Conversations ---
  ConversationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub copiloto-conversations-${Stage}
      CodeUri: ../backend/dist/
      Handler: handlers/conversations.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ConversationsTable
        - DynamoDBReadPolicy:
            TableName: !Ref MessagesTable
      Events:
        ListByUser:
          Type: Api
          Properties:
            RestApiId: !Ref CopilotoApi
            Path: /conversations/{uid}
            Method: GET
        GetConversation:
          Type: Api
          Properties:
            RestApiId: !Ref CopilotoApi
            Path: /conversations/{uid}/{conversationId}
            Method: GET

  # --- Public Knowledge Bases ---
  PublicKnowledgeBasesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub copiloto-public-kb-${Stage}
      CodeUri: ../backend/dist/
      Handler: handlers/publicKnowledgeBases.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref KnowledgeBasesTable
      Events:
        ListPublic:
          Type: Api
          Properties:
            RestApiId: !Ref CopilotoApi
            Path: /knowledge-bases
            Method: GET
        GetBySlug:
          Type: Api
          Properties:
            RestApiId: !Ref CopilotoApi
            Path: /knowledge-bases/{slug}
            Method: GET

  # --- Admin Logs ---
  AdminLogsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub copiloto-admin-logs-${Stage}
      CodeUri: ../backend/dist/
      Handler: handlers/adminLogs.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ConversationsTable
        - DynamoDBReadPolicy:
            TableName: !Ref MessagesTable
        - DynamoDBReadPolicy:
            TableName: !Ref KnowledgeBasesTable
      Events:
        GetLogs:
          Type: Api
          Properties:
            RestApiId: !Ref CopilotoApi
            Path: /admin/logs
            Method: GET

# ============================================================
# Outputs
# ============================================================
Outputs:
  ApiUrl:
    Description: URL da API Gateway
    Value: !Sub https://${CopilotoApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/

  FrontendUrl:
    Description: URL do Frontend (CloudFront)
    Value: !Sub https://${FrontendDistribution.DomainName}

  KnowledgeBucketName:
    Description: Nome do bucket de conhecimento
    Value: !Ref KnowledgeBucket

  FrontendBucketName:
    Description: Nome do bucket do frontend
    Value: !Ref FrontendBucket

  LogsBucketName:
    Description: Nome do bucket de logs de acesso S3
    Value: !Ref LogsBucket
