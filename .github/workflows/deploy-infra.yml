name: Deploy Infrastructure

on:
  push:
    branches: [ main ]
    paths:
      - 'src/infrastructure/**'
      - '.github/workflows/deploy-infra.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.0

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Validate SAM Template
        run: |
          cd src/infrastructure
          sam validate

  # Task 11: deploy de infraestrutura também requer aprovação manual
  # Mudanças de infra têm maior blast radius — aprovação é crítica aqui
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    # Requer aprovação manual configurada em:
    # Settings → Environments → production → Required reviewers
    environment: production
    steps:
      - uses: actions/checkout@v4.2.0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'src/backend/package-lock.json'

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Build & Deploy SAM Stack
        run: |
          # Compila o backend antes do sam build (dist é necessário como CodeUri)
          cd src/backend
          npm ci
          npm run build
          cd ../infrastructure
          sam build
          sam deploy \
            --resolve-s3 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --stack-name copiloto-corporativo-stack \
            --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND \
            --parameter-overrides \
              Stage=prod \
              JwtSecret=${{ secrets.JWT_SECRET }}
