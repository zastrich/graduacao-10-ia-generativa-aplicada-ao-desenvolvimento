name: Deploy Backend Lambdas

on:
  push:
    branches: [ main ]
    paths:
      - 'src/backend/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'src/backend/package-lock.json'

      - name: Install Dependencies
        run: |
          cd src/backend
          npm ci

      # Task 7: auditoria de segurança — usa audit-ci com allowlist para xlsx (sem fix disponível no npm)
      - name: Security Audit
        run: |
          cd src/backend
          npx audit-ci --config audit-ci.jsonc

      - name: Run Unit Tests
        run: |
          cd src/backend
          npm test

      - name: Build TypeScript
        run: |
          cd src/backend
          npm run build

  # Task 11: job separado com gate de aprovação manual via environment "production"
  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    # Requer aprovação manual configurada em:
    # Settings → Environments → production → Required reviewers
    environment: production
    steps:
      - uses: actions/checkout@v4.2.0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'src/backend/package-lock.json'

      - name: Install Dependencies
        run: |
          cd src/backend
          npm ci

      - name: Build TypeScript
        run: |
          cd src/backend
          npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Cleanup SAM managed stack if stuck
        run: |
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name aws-sam-cli-managed-default \
            --region us-east-1 \
            --query "Stacks[0].StackStatus" \
            --output text 2>/dev/null || echo "DOES_NOT_EXIST")
          echo "SAM managed stack status: $STATUS"
          # Deleta a stack managed se estiver em estado inválido (REVIEW_IN_PROGRESS ou ROLLBACK_*)
          if [[ "$STATUS" == "REVIEW_IN_PROGRESS" || "$STATUS" == "ROLLBACK_COMPLETE" || "$STATUS" == "ROLLBACK_FAILED" ]]; then
            echo "Stack em estado inválido ($STATUS). Deletando para permitir recriação pelo SAM..."
            aws cloudformation delete-stack \
              --stack-name aws-sam-cli-managed-default \
              --region us-east-1
            aws cloudformation wait stack-delete-complete \
              --stack-name aws-sam-cli-managed-default \
              --region us-east-1
            echo "Stack deletada com sucesso."
          else
            echo "Stack em estado válido ou inexistente — nenhuma ação necessária."
          fi

      - name: Package & Deploy Lambdas
        env:
          ALLOWED_ORIGIN: ${{ secrets.ALLOWED_ORIGIN || '*' }}
        run: |
          cd src/infrastructure
          sam build
          sam deploy \
            --resolve-s3 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --stack-name copiloto-corporativo-stack \
            --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND \
            --parameter-overrides \
              Stage=prod \
              JwtSecret=${{ secrets.JWT_SECRET }} \
              AllowedOrigin="${ALLOWED_ORIGIN}"
