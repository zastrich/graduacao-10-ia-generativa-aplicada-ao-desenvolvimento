AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: |
  Copiloto Corporativo com IA - Infraestrutura Serverless Assistente corporativo inteligente usando AWS Bedrock (Gemma 3 4b-it)

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod

  # Sem Default — deploy falha explicitamente se não fornecido
  JwtSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: >
      Segredo usado para assinar JWTs. Obrigatório. Gere com:
      node -e "console.log(require('crypto').randomBytes(64).toString('hex'))"

  # Parâmetro para o modelo Bedrock, usado no ARN da IAM policy
  BedrockModelId:
    Type: String
    Default: google.gemma-3-4b-it
    Description: ID do modelo Bedrock usado para inferência.

  # Domínio do CloudFront (ex: d1234abcd.cloudfront.net).
  # Usado em CORS e ALLOWED_ORIGINS. No primeiro deploy use o default '*'.
  # Após o primeiro deploy, atualize com o valor do Output FrontendUrl.
  AllowedOrigin:
    Type: String
    Default: '*'
    Description: >
      Origem permitida para CORS. Use '*' no primeiro deploy.
      Após a criação do CloudFront, atualize para https://<distribuicao>.cloudfront.net

  # -------------------------------------------------------------------
  # Domínio e Route53
  # -------------------------------------------------------------------
  HostedZoneId:
    Type: String
    Default: ''
    Description: >
      ID da Hosted Zone no Route53 (ex: Z0851491YVAOB1BFAMS).
      Se vazio, os recursos de DNS (Route53 records) não serão criados.

  WebDomain:
    Type: String
    Default: ''
    Description: >
      Subdomínio para o frontend (ex: copiloto-corporativo.code200.com.br).
      Se vazio, o CloudFront ficará acessível apenas pelo domínio *.cloudfront.net.

  ApiDomain:
    Type: String
    Default: ''
    Description: >
      Subdomínio para a API (ex: api.copiloto-corporativo.code200.com.br).
      Se vazio, a API ficará acessível apenas pelo endpoint padrão do API Gateway.

  CertificateArn:
    Type: String
    Default: ''
    Description: >
      ARN do certificado ACM (us-east-1) que cobre os domínios WebDomain e ApiDomain.
      Para domínios *.example.com, use um certificado wildcard.
      Se vazio, custom domains não serão configurados.

Conditions:
  # Verdadeiro quando AllowedOrigin ainda é o wildcard do primeiro deploy
  IsWildcardOrigin: !Equals [!Ref AllowedOrigin, '*']
  # Verdadeiro quando temos configuração de domínio customizado completa
  HasCustomDomain: !And
    - !Not [!Equals [!Ref HostedZoneId, '']]
    - !Not [!Equals [!Ref CertificateArn, '']]
  HasWebDomain: !And
    - !Not [!Equals [!Ref WebDomain, '']]
    - !Not [!Equals [!Ref HostedZoneId, '']]
    - !Not [!Equals [!Ref CertificateArn, '']]
  HasApiDomain: !And
    - !Not [!Equals [!Ref ApiDomain, '']]
    - !Not [!Equals [!Ref HostedZoneId, '']]
    - !Not [!Equals [!Ref CertificateArn, '']]

Globals:
  Function:
    Runtime: nodejs24.x
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        KNOWLEDGE_BASES_TABLE: !Ref KnowledgeBasesTable
        CONVERSATIONS_TABLE: !Ref ConversationsTable
        MESSAGES_TABLE: !Ref MessagesTable
        USERS_TABLE: !Ref UsersTable
        KNOWLEDGE_BUCKET: !Ref KnowledgeBucket
        CHUNKS_TABLE: !Ref ChunksTable
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        BEDROCK_REGION: !Ref AWS::Region
        JWT_SECRET: !Ref JwtSecret
        # CORS: usa o parâmetro AllowedOrigin para evitar dependência circular
        # com FrontendDistribution. Atualize para o domínio CloudFront após 1º deploy.
        ALLOWED_ORIGINS: !Ref AllowedOrigin
    Architectures:
      - x86_64

Resources:
  # ============================================================
  # API Gateway
  # ============================================================
  CopilotoApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub copiloto-api-${Stage}
      StageName: !Ref Stage
      # CORS: usa parâmetro AllowedOrigin para evitar dependência circular.
      # Atualize para o domínio CloudFront após o primeiro deploy.
      Cors:
        AllowMethods: '''GET,POST,PUT,DELETE,OPTIONS'''
        AllowHeaders: '''Content-Type,Authorization'''
        AllowOrigin: !Sub '''${AllowedOrigin}'''
        AllowCredentials: !If
          - IsWildcardOrigin
          - false
          - true

  # ============================================================
  # DynamoDB Tables
  # ============================================================
  KnowledgeBasesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub copiloto-knowledge-bases-${Stage}
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: slug
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: slug-index
          KeySchema:
            - AttributeName: slug
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  ConversationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub copiloto-conversations-${Stage}
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: userUid
          AttributeType: S
        - AttributeName: knowledgeBaseId
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: userUid-index
          KeySchema:
            - AttributeName: userUid
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: knowledgeBase-index
          KeySchema:
            - AttributeName: knowledgeBaseId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  MessagesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub copiloto-messages-${Stage}
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
      AttributeDefinitions:
        - AttributeName: conversationId
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: conversationId
          KeyType: HASH
        - AttributeName: createdAt
          KeyType: RANGE

  UsersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub copiloto-users-${Stage}
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: email-index
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  # ============================================================
  # DynamoDB — Parsed Chunks (conteúdo extraído dos arquivos)
  # ============================================================
  ChunksTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub copiloto-chunks-${Stage}
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
      AttributeDefinitions:
        - AttributeName: knowledgeBaseId
          AttributeType: S
        - AttributeName: fileId
          AttributeType: S
      KeySchema:
        - AttributeName: knowledgeBaseId
          KeyType: HASH
        - AttributeName: fileId
          KeyType: RANGE

  # ============================================================
  # S3 Buckets
  # ============================================================

  # Bucket de logs — destino centralizado para access logs
  LogsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub copiloto-logs-${Stage}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
            BucketKeyEnabled: true
      VersioningConfiguration:
        Status: Enabled
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      LoggingConfiguration:
        LogFilePrefix: logs-bucket/

  LogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref LogsBucket
      PolicyDocument:
        Statement:
          - Sid: DenyNonSSLRequests
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt LogsBucket.Arn
              - !Sub ${LogsBucket.Arn}/*
            Condition:
              Bool:
                'aws:SecureTransport': false

  KnowledgeBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub conhecimento-ia-generativa-${Stage}
      # Bucket privado — acesso exclusivo pelas Lambdas via IAM
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
            BucketKeyEnabled: true
      LoggingConfiguration:
        DestinationBucketName: !Ref LogsBucket
        LogFilePrefix: knowledge-bucket/
      # Task 7 / L4: removido CorsConfiguration — bucket é privado, sem acesso direto do browser

  FrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub copiloto-frontend-${Stage}
      # Bucket privado — conteúdo servido exclusivamente via CloudFront (OAC)
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
            BucketKeyEnabled: true
      VersioningConfiguration:
        Status: Enabled
      LoggingConfiguration:
        DestinationBucketName: !Ref LogsBucket
        LogFilePrefix: frontend-bucket/

  # Origin Access Control — permite ao CloudFront assinar requests ao S3
  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub copiloto-frontend-oac-${Stage}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Task 9: Security Headers Policy para o CloudFront
  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub copiloto-security-headers-${Stage}
        Comment: Security headers para o frontend do Copiloto Corporativo
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Preload: true
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          XSSProtection:
            ModeBlock: true
            Protection: true
            Override: true
          ContentSecurityPolicy:
            ContentSecurityPolicy: !If
              - HasApiDomain
              - !Sub "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://${ApiDomain} https://*.execute-api.${AWS::Region}.amazonaws.com; frame-ancestors 'none';"
              - !Sub "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.execute-api.${AWS::Region}.amazonaws.com; frame-ancestors 'none';"
            Override: true

  # CloudFront Distribution — CDN + HTTPS + SPA fallback + Security Headers
  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub Copiloto Frontend - ${Stage}
        DefaultRootObject: index.html
        # Custom domain aliases (condicional)
        Aliases: !If
          - HasWebDomain
          - - !Ref WebDomain
          - !Ref AWS::NoValue
        Origins:
          - Id: FrontendS3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''
            OriginAccessControlId: !GetAtt FrontendOAC.Id
        DefaultCacheBehavior:
          TargetOriginId: FrontendS3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # CachingOptimized (gerenciada pela AWS)
          # Task 9: associa a policy de security headers
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          Compress: true
        # Redireciona erros 403/404 para index.html (SPA routing)
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        # Certificado SSL customizado (condicional)
        ViewerCertificate: !If
          - HasWebDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true

  # Bucket Policy — nega requests sem SSL ao KnowledgeBucket
  KnowledgeBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref KnowledgeBucket
      PolicyDocument:
        Statement:
          - Sid: DenyNonSSLRequests
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt KnowledgeBucket.Arn
              - !Sub ${KnowledgeBucket.Arn}/*
            Condition:
              Bool:
                'aws:SecureTransport': false

  # Bucket Policy — permite apenas CloudFront (OAC) ler objetos do FrontendBucket
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontServicePrincipal
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${FrontendBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}
          - Sid: DenyNonSSLRequests
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt FrontendBucket.Arn
              - !Sub ${FrontendBucket.Arn}/*
            Condition:
              Bool:
                'aws:SecureTransport': false

  # ============================================================
  # Lambda Functions
  # ============================================================

  # --- Auth ---
  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub copiloto-auth-${Stage}
      CodeUri: ../backend/dist/
      Handler: handlers/auth.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
      Events:
        Status:
          Type: Api
          Properties:
            RestApiId: !Ref CopilotoApi
            Path: /auth/status
            Method: GET
        Login:
          Type: Api
          Properties:
            RestApiId: !Ref CopilotoApi
            Path: /auth/login
            Method: POST
        Register:
          Type: Api
          Properties:
            RestApiId: !Ref CopilotoApi
            Path: /auth/register
            Method: POST

  # --- Knowledge Bases ---
  KnowledgeBasesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub copiloto-knowledge-bases-${Stage}
      CodeUri: ../backend/dist/
      Handler: handlers/knowledgeBases.handler
      Timeout: 60
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref KnowledgeBasesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ChunksTable
        - S3CrudPolicy:
            BucketName: !Ref KnowledgeBucket
      Events:
        Create:
          Type: Api
          Properties:
            RestApiId: !Ref CopilotoApi
            Path: /admin/knowledge-bases
            Method: POST
        List:
          Type: Api
          Properties:
            RestApiId: !Ref CopilotoApi
            Path: /admin/knowledge-bases
            Method: GET
        GetOne:
          Type: Api
          Properties:
            RestApiId: !Ref CopilotoApi
            Path: /admin/knowledge-bases/{id}
            Method: GET
        Update:
          Type: Api
          Properties:
            RestApiId: !Ref CopilotoApi
            Path: /admin/knowledge-bases/{id}
            Method: PUT
        Delete:
          Type: Api
          Properties:
            RestApiId: !Ref CopilotoApi
            Path: /admin/knowledge-bases/{id}
            Method: DELETE
        Retrain:
          Type: Api
          Properties:
            RestApiId: !Ref CopilotoApi
            Path: /admin/knowledge-bases/{id}/retrain
            Method: POST

  # --- File Upload ---
  FileUploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub copiloto-file-upload-${Stage}
      CodeUri: ../backend/dist/
      Handler: handlers/files.handler
      Timeout: 120
      MemorySize: 512
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref KnowledgeBasesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ChunksTable
        - S3CrudPolicy:
            BucketName: !Ref KnowledgeBucket
      Events:
        Upload:
          Type: Api
          Properties:
            RestApiId: !Ref CopilotoApi
            Path: /admin/knowledge-bases/{id}/files
            Method: POST
        DeleteFile:
          Type: Api
          Properties:
            RestApiId: !Ref CopilotoApi
            Path: /admin/knowledge-bases/{id}/files/{fileId}
            Method: DELETE
        AddLink:
          Type: Api
          Properties:
            RestApiId: !Ref CopilotoApi
            Path: /admin/knowledge-bases/{id}/links
            Method: POST

  # --- Chat / Inference ---
  ChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub copiloto-chat-${Stage}
      CodeUri: ../backend/dist/
      Handler: handlers/chat.handler
      Timeout: 120
      MemorySize: 512
      Policies:
        # Task 8: KnowledgeBases é só leitura para o chat
        - DynamoDBReadPolicy:
            TableName: !Ref KnowledgeBasesTable
        - DynamoDBReadPolicy:
            TableName: !Ref ChunksTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConversationsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MessagesTable
        - S3ReadPolicy:
            BucketName: !Ref KnowledgeBucket
        # Task 8: Bedrock restrito ao ARN do modelo específico
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource:
                - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}
      Events:
        SendMessage:
          Type: Api
          Properties:
            RestApiId: !Ref CopilotoApi
            Path: /chat/{slug}
            Method: POST

  # --- Conversations ---
  ConversationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub copiloto-conversations-${Stage}
      CodeUri: ../backend/dist/
      Handler: handlers/conversations.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ConversationsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MessagesTable
      Events:
        ListByUser:
          Type: Api
          Properties:
            RestApiId: !Ref CopilotoApi
            Path: /conversations/{uid}
            Method: GET
        GetConversation:
          Type: Api
          Properties:
            RestApiId: !Ref CopilotoApi
            Path: /conversations/{uid}/{conversationId}
            Method: GET
        DeleteConversation:
          Type: Api
          Properties:
            RestApiId: !Ref CopilotoApi
            Path: /conversations/{uid}/{conversationId}
            Method: DELETE

  # --- Public Knowledge Bases ---
  PublicKnowledgeBasesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub copiloto-public-kb-${Stage}
      CodeUri: ../backend/dist/
      Handler: handlers/publicKnowledgeBases.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref KnowledgeBasesTable
      Events:
        ListPublic:
          Type: Api
          Properties:
            RestApiId: !Ref CopilotoApi
            Path: /knowledge-bases
            Method: GET
        GetBySlug:
          Type: Api
          Properties:
            RestApiId: !Ref CopilotoApi
            Path: /knowledge-bases/{slug}
            Method: GET

  # --- Admin Logs ---
  AdminLogsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub copiloto-admin-logs-${Stage}
      CodeUri: ../backend/dist/
      Handler: handlers/adminLogs.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ConversationsTable
        - DynamoDBReadPolicy:
            TableName: !Ref MessagesTable
        - DynamoDBReadPolicy:
            TableName: !Ref KnowledgeBasesTable
      Events:
        GetLogs:
          Type: Api
          Properties:
            RestApiId: !Ref CopilotoApi
            Path: /admin/logs
            Method: GET

  # ============================================================
  # API Gateway Custom Domain
  # ============================================================
  ApiCustomDomain:
    Type: AWS::ApiGateway::DomainName
    Condition: HasApiDomain
    Properties:
      DomainName: !Ref ApiDomain
      RegionalCertificateArn: !Ref CertificateArn
      EndpointConfiguration:
        Types:
          - REGIONAL
      SecurityPolicy: TLS_1_2

  ApiBasePathMapping:
    Type: AWS::ApiGateway::BasePathMapping
    Condition: HasApiDomain
    Properties:
      DomainName: !Ref ApiCustomDomain
      RestApiId: !Ref CopilotoApi
      Stage: !Ref Stage

  # ============================================================
  # Route53 DNS Records
  # ============================================================
  WebDnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasWebDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref WebDomain
      Type: A
      AliasTarget:
        DNSName: !GetAtt FrontendDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2  # CloudFront global hosted zone ID (fixo)
        EvaluateTargetHealth: false

  ApiDnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasApiDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref ApiDomain
      Type: A
      AliasTarget:
        DNSName: !GetAtt ApiCustomDomain.RegionalDomainName
        HostedZoneId: !GetAtt ApiCustomDomain.RegionalHostedZoneId
        EvaluateTargetHealth: false

# ============================================================
# Outputs
# ============================================================
Outputs:
  ApiUrl:
    Description: URL da API Gateway (endpoint padrão)
    Value: !Sub https://${CopilotoApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/

  ApiCustomUrl:
    Description: URL da API com domínio customizado
    Condition: HasApiDomain
    Value: !Sub https://${ApiDomain}/

  FrontendUrl:
    Description: URL do Frontend (CloudFront)
    Value: !Sub https://${FrontendDistribution.DomainName}

  FrontendCustomUrl:
    Description: URL do Frontend com domínio customizado
    Condition: HasWebDomain
    Value: !Sub https://${WebDomain}

  KnowledgeBucketName:
    Description: Nome do bucket de conhecimento
    Value: !Ref KnowledgeBucket

  FrontendBucketName:
    Description: Nome do bucket do frontend
    Value: !Ref FrontendBucket

  LogsBucketName:
    Description: Nome do bucket de logs de acesso S3
    Value: !Ref LogsBucket

  CloudFrontDistributionId:
    Description: ID da distribuição CloudFront
    Value: !Ref FrontendDistribution
