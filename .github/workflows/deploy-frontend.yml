name: Deploy Frontend SPA

on:
  push:
    branches: [ main ]
    paths:
      - 'src/frontend/**'
      - '.github/workflows/deploy-frontend.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'src/frontend/package-lock.json'

      - name: Install Dependencies
        run: |
          cd src/frontend
          npm ci

      - name: Security Audit
        run: |
          cd src/frontend
          npx audit-ci --config audit-ci.jsonc

      - name: Build React SPA
        run: |
          cd src/frontend
          npm run build
        env:
          # VITE_API_URL é uma variable (não secret) — valor não sensível
          VITE_API_URL: ${{ vars.VITE_API_URL }}

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4.2.0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'src/frontend/package-lock.json'

      - name: Install Dependencies
        run: |
          cd src/frontend
          npm ci

      - name: Build React SPA
        run: |
          cd src/frontend
          npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sync Static Files to S3 Bucket
        run: |
          # FRONTEND_S3_BUCKET é uma variable (Settings → Variables)
          BUCKET="${{ vars.FRONTEND_S3_BUCKET }}"
          if [ -z "$BUCKET" ]; then
            echo "::error::Variable FRONTEND_S3_BUCKET não configurada. Acesse Settings → Variables e adicione o nome do bucket."
            exit 1
          fi
          # Arquivos com hash (JS/CSS gerados pelo Vite) — cache longo
          aws s3 sync src/frontend/dist/ s3://${BUCKET} \
            --delete \
            --exclude "index.html" \
            --cache-control "public, max-age=31536000, immutable"
          # index.html — sem cache para garantir versão mais recente
          aws s3 cp src/frontend/dist/index.html s3://${BUCKET}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront Cache
        run: |
          # CLOUDFRONT_DISTRIBUTION_ID é uma variable (Settings → Variables)
          CF_ID="${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}"
          if [ -z "$CF_ID" ]; then
            echo "::warning::Variable CLOUDFRONT_DISTRIBUTION_ID não configurada — invalidação ignorada."
            exit 0
          fi
          aws cloudfront create-invalidation \
            --distribution-id "${CF_ID}" \
            --paths "/*"
