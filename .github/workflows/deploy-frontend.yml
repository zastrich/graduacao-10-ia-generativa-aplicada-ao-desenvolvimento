name: Deploy Frontend SPA

on:
  push:
    branches: [ main ]
    paths:
      - 'src/frontend/**'
      - '.github/workflows/deploy-frontend.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'src/frontend/package-lock.json'

      - name: Install Dependencies
        run: |
          cd src/frontend
          npm ci

      # Task 11: auditoria de segurança de dependências — bloqueia vulnerabilidades altas/críticas
      - name: Security Audit
        run: |
          cd src/frontend
          npm audit --audit-level=high

      - name: Build React SPA
        run: |
          cd src/frontend
          npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

  # Task 11: job separado com gate de aprovação manual via environment "production"
  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    # Requer aprovação manual configurada em:
    # Settings → Environments → production → Required reviewers
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'src/frontend/package-lock.json'

      - name: Install Dependencies
        run: |
          cd src/frontend
          npm ci

      - name: Build React SPA
        run: |
          cd src/frontend
          npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sync Static Files to S3 Bucket
        run: |
          # Arquivos com hash no nome (JS/CSS gerados pelo Vite) — cache longo
          aws s3 sync src/frontend/dist/ s3://${{ secrets.FRONTEND_S3_BUCKET }} \
            --delete \
            --exclude "index.html" \
            --cache-control "public, max-age=31536000, immutable"
          # index.html — sem cache para garantir versão mais recente
          aws s3 cp src/frontend/dist/index.html s3://${{ secrets.FRONTEND_S3_BUCKET }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
